# 自定义业务配置
gateway:
  jwt:
    hmac-secret-base64: ${IAM_JWT_HS256_KEY_BASE64}
    issuer: mall-iam
    audience: mall-gateway
  login:
    risk:
      max-ip-requests-per-minute: 30
  security:
    trusted-nginx-ip: ${TRUSTED_NGINX_IP:192.168.195.128}

server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.195.128:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

    gateway:
      server:
        webflux:
          routes:
            # Ordinary-user login: no Method predicate so validation filter can return HTTP 405.
            - id: iam-login-route
              order: -20
              uri: lb://iam-service
              predicates:
                - Path=/api/iam/auth/login
              filters:
                - name: LoginValidation
                - name: LoginRisk
                - RewritePath=/api/iam/(?<segment>.*), /api/v1/$\{segment}
            # Refresh and logout are POST-only and use cookie-scoped refresh credentials.
            - id: iam-session-route
              order: -15
              uri: lb://iam-service
              predicates:
                - Path=/api/iam/auth/refresh, /api/iam/auth/logout
                - Method=POST
              filters:
                - RewritePath=/api/iam/(?<segment>.*), /api/v1/$\{segment}
            # 注册接口专用路由
            - id: iam-register-route
              order: -10
              uri: lb://iam-service
              predicates:
                - Path=/api/iam/auth/register, /api/iam/auth/register/code
                - Method=POST
              filters:
                - name: RegisterValidation
                - name: RegisterRisk
                - RewritePath=/api/iam/(?<segment>.*), /api/v1/$\{segment}
            # IAM 通用路由
            - id: iam-service-route
              order: 0
              uri: lb://iam-service
              predicates:
                - Path=/api/iam/**
              filters:
                - RewritePath=/api/iam/(?<segment>.*), /api/v1/$\{segment}

            # Ordinary-user business routes; business services MUST enforce their own permissions.
            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/api/product/**
              filters:
                - RewritePath=/api/product/(?<segment>.*), /api/v1/$\{segment}
            - id: cart-service-route
              uri: lb://cart-service
              predicates:
                - Path=/api/cart/**
              filters:
                - RewritePath=/api/cart/(?<segment>.*), /api/v1/$\{segment}
            - id: order-service-route
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
              filters:
                - RewritePath=/api/order/(?<segment>.*), /api/v1/$\{segment}
            - id: merchant-service-route
              uri: lb://merchant-service
              predicates:
                - Path=/api/merchant/**
              filters:
                - RewritePath=/api/merchant/(?<segment>.*), /api/v1/$\{segment}


  data:
    redis:
      host: ${REDIS_HOST:192.168.195.128}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3s


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
