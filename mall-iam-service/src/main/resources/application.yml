server:
  port: 8101

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s

  datasource:
    url: ${IAM_DB_URL}
    username: ${IAM_DB_USERNAME}
    password: ${IAM_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  application:
    name: iam-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}


iam:
  registration:
    code-lease-seconds: 120
    code-expire-seconds: 300
    code-send-cooldown-seconds: 60
    code-send-max-per-day: 10
  outbox:
    scan-delay-ms: 5000
  snowflake:
    worker-id: ${IAM_SNOWFLAKE_WORKER_ID:1}


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true


# XXL-JOB 执行器配置
xxl:
  job:
    admin:
      # XXL-JOB Admin 地址
      addresses: ${XXL_JOB_ADMIN_ADDRESSES}
      # 3.4.2 使用 admin.accessToken 配置
      accessToken: ${XXL_JOB_ACCESS_TOKEN}
      # 通信超时时间
      timeout: 3

    executor:
      # 开启执行器
      enabled: true

      # 执行器 AppName
      appname: mall-iam-service

      # Docker 容器内 IAM 的注册地址
      address: ${XXL_JOB_EXECUTOR_ADDRESS}

      # 使用 address 注册时 IP 留空
      ip: ""

      # XXL-JOB 内嵌服务端口
      port: ${XXL_JOB_EXECUTOR_PORT:9998}

      # XXL-JOB 执行日志目录
      logpath: ${XXL_JOB_EXECUTOR_LOGPATH:/data/applogs/xxl-job/jobhandler}

      # 日志保留天数
      logretentiondays: 30

      # 排除扫描的包
      excludedpackage: ""


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 关于IDEA的红色按钮停止项目后报错：
# Spring Boot 没问题、POM 没问题、Nacos Server 3.2.4 没问题、Nacos Client 注册/注销也没问题。
# 问题主要出在 IDEA 红色 Stop 对 Java 进程的中断方式，与 Nacos Client 3.0.3 的 shutdown hook 销毁顺序发生竞争。
