# =========================
# 服务的健康检查
# 服务    当前检查内容    能判断什么
#   MySQL    SELECT 1    数据库可以连接并执行查询
#   Redis    PING    Redis 可以正常响应命令
#    RabbitMQ    check_running    RabbitMQ 应用正在运行
#   Nacos    官方 readiness 接口    Nacos 是否处于就绪状态
#   Nginx    自定义 /nginx-health    Nginx 能否响应请求
#   XXL-JOB    请求首页 /    只能确认 HTTP 服务响应正常
# =========================

services:

  # =========================
  # 业务 MySQL
  # =========================
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: mysql-server
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}

    ports:
      - "${MYSQL_PORT}:3306"

    volumes:
      - ./config/mysql/data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -uroot -N -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # =========================
  # 配置 MySQL
  # Nacos 和 XXL-JOB 共用此实例
  # =========================
  config-mysql:
    image: mysql:${CONFIG_MYSQL_VERSION}
    container_name: config-mysql-server
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_CONFIG}
      MYSQL_DATABASE: ${NACOS_DB_NAME}
      MYSQL_USER: ${NACOS_DB_USERNAME}
      MYSQL_PASSWORD: ${NACOS_DB_PASSWORD}
      TZ: ${TZ}

    ports:
      - "${CONFIG_MYSQL_PORT}:3306"

    volumes:
      - ./config/nacos-mysql/data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -uroot -N -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # =========================
  # Nacos 注册中心 / 配置中心
  # =========================
  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: nacos
    restart: unless-stopped

    depends_on:
      config-mysql:
        condition: service_healthy

    environment:
      MODE: ${NACOS_MODE}
      SPRING_DATASOURCE_PLATFORM: mysql

      MYSQL_SERVICE_HOST: config-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB_NAME}
      MYSQL_SERVICE_USER: ${NACOS_DB_USERNAME}
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: ${NACOS_DB_PARAM}

      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE}
      NACOS_AUTH_ADMIN_ENABLE: ${NACOS_AUTH_ADMIN_ENABLE}
      NACOS_AUTH_CONSOLE_ENABLE: ${NACOS_AUTH_CONSOLE_ENABLE}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}

      JVM_XMS: ${NACOS_JVM_XMS}
      JVM_XMX: ${NACOS_JVM_XMX}

      TZ: ${TZ}

    ports:
      - "${NACOS_PORT}:8848"
      - "${NACOS_GRPC_PORT}:9848"
      - "${NACOS_CONSOLE_PORT}:8080"



    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS --max-time 5 http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness | grep -Eq "\"data\"[[:space:]]*:[[:space:]]*\"ok\""'
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 60s




  # =========================
  # Redis 缓存
  # =========================
  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis-server
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ}

    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"

    volumes:
      - ./config/redis/data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -qx PONG'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


  # =========================
  # Nginx 网关
  # =========================
  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: nginx-server
    restart: unless-stopped

    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"

    environment:
      TZ: ${TZ}

    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Nginx 自身健康检查
    # 访问 HTTP /nginx-health，返回 nginx ok
    # 不经过 HTTPS 重定向，也不依赖 Gateway

    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-check-certificate -q -T 5 -O - https://127.0.0.1:443/nginx-health | grep -qx "nginx ok"'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s



  # =========================
  # RabbitMQ 消息队列
  # =========================
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}
    container_name: rabbitmq-server
    hostname: rabbitmq
    restart: unless-stopped

    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: ${TZ}

    volumes:
      - ./config/rabbitmq/data:/var/lib/rabbitmq

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s


  # =========================
  # XXL-JOB 调度中心
  # 使用 config-mysql
  # =========================
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:${XXL_JOB_VERSION}
    container_name: xxl-job-admin
    restart: unless-stopped

    depends_on:
      config-mysql:
        condition: service_healthy

    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://config-mysql:3306/${XXL_JOB_DB_NAME}?${XXL_JOB_DB_PARAM}
        --spring.datasource.username=${XXL_JOB_DB_USERNAME}
        --spring.datasource.password=${XXL_JOB_DB_PASSWORD}
        --server.port=8080
        --server.servlet.context-path=${XXL_JOB_CONTEXT_PATH}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN}

      JAVA_OPTS: ${XXL_JOB_JAVA_OPTS}
      LOG_HOME: /data/applogs
      TZ: ${TZ}

    ports:
      - "${XXL_JOB_ADMIN_PORT}:8080"

    volumes:
      - ./config/xxl-job/logs:/data/applogs


    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/'
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s

