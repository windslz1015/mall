services:
  # =========================
  # 关于用户
  #Nginx：不需要新建认证用户，但会自动有运行用户。
  #Redis：不需要新建用户，但生产环境要设密码、限制绑定 IP 和防火墙。Redis 6+ 可以建 ACL 用户，但不是必须。
  #Linux：不需要为了连服务而新建用户，包安装会自动创建服务运行用户。
  #MySQL：需要新建业务用户，不用 root 远程。
  #RabbitMQ：远程连接必须新建用户，guest 只能本机。
  #Nacos：默认有内置认证用户 nacos/nacos，开发环境可用；生产环境必须开启鉴权、修改默认密码，最好新建专用用户并分配角色权限。Nacos 客户端连接时通过
  # =========================
  # =========================
  # 业务数据库
  # =========================
  mysql:
    image: mysql:8.4
    container_name: mysql-server
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - ./config/mysql/data:/var/lib/mysql


  # =========================
  # Nacos 专用数据库
  # =========================
  nacos-mysql:
    image: mysql:8.0
    container_name: nacos-mysql-server
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: nacos_config
      MYSQL_USER: nacos
      MYSQL_PASSWORD: nacos123

    ports:
      - "3307:3306"

    volumes:
      - ./config/nacos-mysql/data:/var/lib/mysql


  # =========================
  # Nacos
  # =========================
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: nacos
    restart: unless-stopped

    depends_on:
      - nacos-mysql

    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql

      MYSQL_SERVICE_HOST: nacos-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: nacos123

      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"

      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "TmFjb3NTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ="
      NACOS_AUTH_IDENTITY_KEY: "nacos"
      NACOS_AUTH_IDENTITY_VALUE: "nacos"

      JVM_XMS: 512m
      JVM_XMX: 512m

    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"


  # =========================
  # Redis
  # =========================
  redis:
    image: redis:8.6-alpine
    container_name: redis-server
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"

    volumes:
      - ./config/redis/data:/data


  # =========================
  # Nginx
  # =========================
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx-server
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"