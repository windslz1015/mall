# 以下配置放在nginx.conf 的 http {} 内
# 如果使用 conf.d/*.conf，通常已经处于 http 上下文

#通用限流：根据ip限制，请求频率限制：每秒 20 次，突发 40
limit_req_zone $binary_remote_addr zone=req_ip:10m rate=20r/s;
#注册接口限流：根据ip限制 每分钟 5 次，突发 3
limit_req_zone $binary_remote_addr zone=register_ip:10m rate=5r/m;
#并发连接限制区域：根据客户端IP限制并发 并发连接限制区域
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

# 限流状态码
limit_req_status 429;
limit_conn_status 429;

# HTTP 自动跳转到 HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}
# HTTPS 接入
server {
    listen 443 ssl;
    server_name localhost;

    # TLS证书
    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;


    # 请求体大小限制
    client_max_body_size 1m;
    # 请求超时
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;


    # 反向代理超时
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    # 代理请求头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 注册接口专用限流转发Gateway
    # TODO: 改成 Gateway 实际对外暴露的注册路径
    location = /api/iam/auth/register {
       # 按 IP 请求频率限制
       limit_req zone=register_ip burst=3 nodelay;
       # 按 IP 并发连接限制
       limit_conn conn_ip 10;
       proxy_pass http://192.168.195.1:8080;
    }
    # 其他请求转发到Gateway
    location / {
        limit_req zone=req_ip burst=40 nodelay;
        limit_conn conn_ip 10;
        proxy_pass http://192.168.195.1:8080;
    }
    #Nginx自身健康检查
    location = /nginx-health {
        default_type text/plain;
        return 200 "nginx ok\n";
    }
}